# Sample configuration — HACS does NOT deploy this file.
# After installing via HACS, create /homeassistant/appdaemon/apps/apps.yaml in the
# File Editor and paste this block in (alongside any other apps you have configured).

recent_detections:
  module: recent_detections
  class: RecentDetections

  # UniFi Protect connection
  host: !secret unifi_protect_host
  port: 443
  username: !secret unifi_protect_username
  password: !secret unifi_protect_password
  verify_ssl: false

  # What to fetch
  hours: 2          # how far back to look each run
  count: 6          # thumbnails to include in manifest (should be >= card's lightbox_count)
  # types:          # uncomment to restrict; default is all four
  #   - person
  #   - animal
  #   - vehicle
  #   - package

  # Schedule
  interval: 300     # seconds between runs (300 = every 5 minutes); a safety net, not the main path
  followup_seconds: 600  # keep re-checking this long while a detection is pending
  poll_fast_interval: 3  # seconds between checks for the first poll_fast_window seconds
  poll_fast_window: 300  # keep the tight cadence well past typical event length
  poll_slow_interval: 5  # slower cadence for the long tail
  # timing_log: /homeassistant/appdaemon/unifi_events_timings.csv  # optional, for tuning
  # trigger_sensors:  # optional but recommended: a detection starting shows a placeholder
  #                   # immediately, and a detection ending fetches the thumbnail.
  #                   # Entity IDs must match exactly - the app warns at startup if one
  #                   # is unknown to HA (a wrong id binds silently and never fires).
  #   - binary_sensor.cam_person_detected
  #   - binary_sensor.cam_animal_detected

  # Output
  output_dir: /homeassistant/www/unifi_events
  web_root: /local/unifi_events
